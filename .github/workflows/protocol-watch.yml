name: Protocol Watch

# Weekly diff of rippled develop's protocol definition files against the
# baseline recorded in the tracking issue. When a watched file changes, a
# comment lands on the issue with links to the diffs — the manual "did the
# protocol move?" ritual becomes a notification.
#
# Coverage is an explicit list of full repo-relative paths (WATCH), so files
# from any directory can be tracked: the five protocol .macro definition files
# plus three headers the SDK mirrors but which live outside the macros —
# TxFlags.h (transaction flags), TER.h (result codes) and LedgerFormats.h
# (lsf ledger-object flags, vendored as a test fixture and diffed by
# TestULedgerFlagsConformance, which compares against a pinned copy and so
# cannot notice upstream moving on its own).
#
# State lives in the tracking issue body (labeled protocol-watch), not in the
# repo and not in actions cache: no commits through branch protection, no
# cache eviction. The baseline JSON is keyed by full path.
#
# A second watch runs the same comparison over the rippled sources the
# Xrpl.Amounts payment engine is ported from (engine-watch): the steps, the
# offer stream, the AMM helpers, STAmount / IOUAmount / Number arithmetic,
# Quality, PaymentSandbox, and the OfferCreate and Payment transactors with the
# helpers they call. The port is exact to the last digit only while these files
# stay as they were at the ported release, so any change to them is a decision
# the port has to follow. Its baseline starts from that release (BASELINE_REF)
# rather than from develop's tip, so what develop already changed since the
# release is reported on the first run instead of being absorbed silently.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write

env:
  UPSTREAM: XRPLF/rippled
  UPSTREAM_REF: develop

jobs:
  watch:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    # Only one run per watch may read/update its tracking-issue state at a time
    concurrency:
      group: ${{ matrix.label }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: protocol-watch
            title: 'Protocol watch: rippled develop'
            description: rippled develop protocol tracking
            what: Protocol definitions
            baseline_ref: ''
            follow_up: 'sync `definitions.json` (`server_definitions` diff), new amendments for the nightly stand config, new transaction/ledger-object fields, flags or result codes for the models.'
            # Explicit watch list — full repo-relative paths, one per line
            watch: |
              include/xrpl/protocol/detail/features.macro
              include/xrpl/protocol/detail/ledger_entries.macro
              include/xrpl/protocol/detail/permissions.macro
              include/xrpl/protocol/detail/sfields.macro
              include/xrpl/protocol/detail/transactions.macro
              include/xrpl/protocol/TxFlags.h
              include/xrpl/protocol/TER.h
              include/xrpl/protocol/LedgerFormats.h
          - label: engine-watch
            title: 'Engine watch: rippled develop payment engine'
            description: rippled develop payment engine tracking
            what: Payment engine sources
            # The release Xrpl.Amounts is ported from; bump it with the port.
            baseline_ref: '3.4.0'
            follow_up: 'port the change to `Xrpl/Amounts` (steps in `Dex/FlowSteps.cs`, `Dex/BookCrossingStep.cs`, `Dex/StrandBuilder.cs`, `Dex/StrandFlow.cs`; pools in `Dex/AmmSwap.cs`, `Dex/AmmBookLiquidity.cs`; the view in `Dex/DexView.cs`; the transactors in `Dex/OfferCreateCrossing.cs`, `Dex/PaymentFlow.cs`; the path finder in `Paths/Pathfinder.cs`, `Paths/PathFinding.cs`, `Paths/BookIndex.cs`; the rules read outside a transaction in `LedgerRules`; arithmetic in `XrplAmountMath.cs`, `XrplQuality.cs`, `XrplNumber`), gate it on its amendment in `LedgerRules`, extend the replayed rippled tests, and rerun `TestIBookCrossing*`, `TestIPaymentFlow`, `TestIOfferCreateChecks`, `TestIPermissionedDex`, `TestIDexQuotes` and `TestIPathFinding` against a stand on the new build.'
            watch: |
              src/libxrpl/tx/paths/AMMLiquidity.cpp
              src/libxrpl/tx/paths/AMMOffer.cpp
              src/libxrpl/tx/paths/BookStep.cpp
              src/libxrpl/tx/paths/BookTip.cpp
              src/libxrpl/tx/paths/DirectStep.cpp
              src/libxrpl/tx/paths/Flow.cpp
              src/libxrpl/tx/paths/OfferStream.cpp
              src/libxrpl/tx/paths/PaySteps.cpp
              src/libxrpl/tx/paths/RippleCalc.cpp
              src/libxrpl/tx/paths/XRPEndpointStep.cpp
              include/xrpl/tx/paths/AMMLiquidity.h
              include/xrpl/tx/paths/AMMOffer.h
              include/xrpl/tx/paths/Offer.h
              include/xrpl/tx/paths/OfferStream.h
              include/xrpl/tx/paths/detail/StepChecks.h
              include/xrpl/tx/paths/detail/Steps.h
              include/xrpl/tx/paths/detail/StrandFlow.h
              include/xrpl/tx/transactors/dex/AMMContext.h
              include/xrpl/ledger/helpers/AMMHelpers.h
              src/libxrpl/ledger/helpers/AMMHelpers.cpp
              include/xrpl/protocol/AMMCore.h
              src/libxrpl/protocol/AMMCore.cpp
              include/xrpl/protocol/Quality.h
              src/libxrpl/protocol/Quality.cpp
              include/xrpl/protocol/QualityFunction.h
              src/libxrpl/protocol/QualityFunction.cpp
              include/xrpl/protocol/STAmount.h
              src/libxrpl/protocol/STAmount.cpp
              include/xrpl/protocol/IOUAmount.h
              src/libxrpl/protocol/IOUAmount.cpp
              include/xrpl/basics/Number.h
              src/libxrpl/basics/Number.cpp
              include/xrpl/ledger/PaymentSandbox.h
              src/libxrpl/ledger/PaymentSandbox.cpp
              src/libxrpl/ledger/helpers/RippleStateHelpers.cpp
              src/libxrpl/ledger/helpers/TokenHelpers.cpp
              src/libxrpl/ledger/helpers/OfferHelpers.cpp
              src/libxrpl/ledger/helpers/PermissionedDEXHelpers.cpp
              src/libxrpl/ledger/helpers/CredentialHelpers.cpp
              src/libxrpl/tx/transactors/dex/OfferCreate.cpp
              src/libxrpl/tx/transactors/payment/Payment.cpp
              src/xrpld/rpc/detail/Pathfinder.cpp
              src/xrpld/rpc/detail/Pathfinder.h
              src/xrpld/rpc/detail/PathfinderUtils.h
              src/xrpld/rpc/detail/PathRequest.cpp
              src/xrpld/rpc/detail/AssetCache.cpp
              src/xrpld/rpc/detail/TrustLine.cpp
              src/xrpld/rpc/detail/AccountAssets.cpp
              src/xrpld/app/ledger/OrderBookDBImpl.cpp
              src/xrpld/rpc/handlers/orderbook/RipplePathFind.cpp
              include/xrpl/protocol/STPathSet.h
              src/libxrpl/protocol/STPathSet.cpp
              src/libxrpl/protocol/Rules.cpp
    steps:
      - name: Compare watched files against tracked baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WATCH: ${{ matrix.watch }}
          ISSUE_TITLE: ${{ matrix.title }}
          ISSUE_LABEL: ${{ matrix.label }}
          LABEL_DESCRIPTION: ${{ matrix.description }}
          WHAT: ${{ matrix.what }}
          BASELINE_REF: ${{ matrix.baseline_ref }}
          FOLLOW_UP: ${{ matrix.follow_up }}
        run: |
          set -euo pipefail

          # Resolve the upstream head first, then pin the contents lookups to it
          # so the recorded shas and the diff links refer to the same commit
          head_sha=$(gh api "repos/$UPSTREAM/commits/$UPSTREAM_REF" --jq .sha)

          # The path->blob-sha map of the explicit watch list at a ref.
          # Fail closed: only a genuine HTTP 404 means "removed upstream" (omit it
          # so the union diff flags it as removed); any other failure (401/403/429/
          # 5xx, network) aborts the run so a transient error can never drop an
          # entry and overwrite the baseline.
          snapshot_at() {
            local ref=$1 map='{}' path resp sha
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if resp=$(gh api "repos/$UPSTREAM/contents/$path?ref=$ref" 2>/tmp/gh_err); then
                # A file returns an object with a string sha; a directory returns an array
                sha=$(printf '%s' "$resp" | jq -r 'select(type == "object" and .type == "file") | .sha // empty')
                if [ -z "$sha" ]; then
                  echo "::error::watched path is not a file with a sha: $path" >&2
                  return 1
                fi
                map=$(jq -n --argjson cur "$map" --arg p "$path" --arg s "$sha" '$cur + {($p): $s}')
              elif grep -q 'HTTP 404' /tmp/gh_err; then
                echo "::warning::watched path not found at $ref (404): $path" >&2
              else
                echo "::error::lookup failed for $path at $ref:" >&2
                cat /tmp/gh_err >&2
                return 1
              fi
            done <<< "$WATCH"
            printf '%s' "$map"
          }

          current=$(snapshot_at "$head_sha")
          echo "current: $current"

          baseline_body() {
            printf 'Automated baseline for the weekly %s (.github/workflows/protocol-watch.yml). Do not edit the JSON block by hand.\n\nLast checked upstream commit: %s\n\n```json\n%s\n```\n' "$ISSUE_LABEL" "$1" "$2"
          }

          # Find the tracking issue
          issue=$(gh issue list --repo "$REPO" --label "$ISSUE_LABEL" --state open \
            --json number,body --jq '.[0] // empty')

          if [ -z "$issue" ]; then
            gh label create "$ISSUE_LABEL" --repo "$REPO" \
              --description "$LABEL_DESCRIPTION" --color 5319e7 2>/dev/null || true

            # Without a baseline ref the tip is the baseline and there is nothing to
            # report yet; with one, the watch starts from that ref and goes on to
            # report what the tip changed since.
            if [ -z "$BASELINE_REF" ]; then
              gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$(baseline_body "$head_sha" "$current")"
              echo "Baseline issue created."
              exit 0
            fi

            baseline=$(snapshot_at "$BASELINE_REF")
            url=$(gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$(baseline_body "$BASELINE_REF" "$baseline")")
            echo "Baseline issue created from $BASELINE_REF: $url"
            issue=$(gh issue view "$url" --repo "$REPO" --json number,body)
          fi

          number=$(echo "$issue" | jq -r .number)
          # Fail closed on a corrupted baseline: an empty-object fallback would
          # report every file as changed and overwrite the evidence
          # Strip a trailing CR first: a CRLF-encoded issue body (e.g. from a
          # hand-edit on Windows) would leave `\r` before the `$` anchor and the
          # fence never matches, tripping the fail-closed guard below
          block=$(echo "$issue" | jq -r .body | awk '{sub(/\r$/,"")} /^```json$/{f=1;next} /^```$/{f=0} f')
          if [ -z "$block" ]; then
            echo "::error::Tracking issue #$number has no JSON baseline block. Fix the issue body or close the issue to bootstrap a fresh baseline."
            exit 1
          fi
          if ! stored=$(echo "$block" | jq -ce 'select(type == "object" and (to_entries | all(.value | type == "string")))'); then
            echo "::error::Tracking issue #$number JSON baseline is malformed. Fix the issue body or close the issue to bootstrap a fresh baseline."
            exit 1
          fi
          # A path added to the watch list since the baseline was recorded starts from the
          # baseline ref, like the rest - not from the tip, which would absorb what the tip
          # already changed.
          if [ -n "$BASELINE_REF" ]; then
            added=$(jq -rn --argjson cur "$current" --argjson old "$stored" '($cur | keys) - ($old | keys) | .[]')
            if [ -n "$added" ]; then
              baseline_added=$(WATCH="$added" snapshot_at "$BASELINE_REF")
              stored=$(jq -cn --argjson old "$stored" --argjson add "$baseline_added" '$add + $old')
            fi
          fi
          echo "stored: $stored"

          # Union of keys so upstream file removals/renames are detected too
          changed=$(jq -n --argjson cur "$current" --argjson old "$stored" \
            '[(($cur | keys) + ($old | keys) | unique)[] | select($cur[.] != $old[.])]')
          echo "changed: $changed"

          if [ "$(echo "$changed" | jq length)" -eq 0 ]; then
            echo "No changes to the watched files."
            exit 0
          fi

          # Build a comment with per-file history links and the actual diff; a path
          # missing from the current snapshot was removed/renamed upstream - do not
          # link a 404 blob.
          #
          # The diff is the point of this comment. Naming the files that moved still
          # leaves the operator to fetch two blobs and compare them by hand, which is
          # the work the watch exists to save. Both blob shas are already known here -
          # the baseline holds the old one, the snapshot the new - so the content can
          # be fetched by sha and diffed directly.
          #
          # Rendering a diff is best-effort while the notification is not: a blob
          # fetch that fails leaves the file listed with its links and a note, rather
          # than aborting a run whose job is to tell somebody that something changed.
          DIFF_LINES_PER_FILE=80

          fetch_blob() {
            gh api "repos/$UPSTREAM/git/blobs/$1" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null
          }

          # GitHub refuses an issue comment over 65536 characters, and a refused
          # comment would leave the baseline unchanged for every later run to
          # retry. Past this size the notification drops the diffs and keeps the
          # links, which stay small however many files moved.
          MAX_COMMENT_CHARS=60000

          files=$(echo "$changed" | jq -r '.[]')
          lines=""
          links=""
          for f in $files; do
            if [ "$(echo "$current" | jq --arg f "$f" 'has($f)')" != "true" ]; then
              entry="- \`$f\` — **removed or renamed upstream** · [history](https://github.com/$UPSTREAM/commits/$UPSTREAM_REF/$f)"$'\n'
              lines="$lines$entry"
              links="$links$entry"
              continue
            fi

            entry="- \`$f\` — [history](https://github.com/$UPSTREAM/commits/$UPSTREAM_REF/$f) · [current](https://github.com/$UPSTREAM/blob/$head_sha/$f)"$'\n'
            lines="$lines$entry"
            links="$links$entry"

            new_sha=$(echo "$current" | jq -r --arg f "$f" '.[$f]')
            old_sha=$(echo "$stored" | jq -r --arg f "$f" '.[$f] // empty')

            if [ -z "$old_sha" ]; then
              lines="$lines"'  <br>**new file upstream** — nothing to diff against.'$'\n'
              continue
            fi

            if ! fetch_blob "$old_sha" > /tmp/pw_old 2>/dev/null || ! fetch_blob "$new_sha" > /tmp/pw_new 2>/dev/null; then
              lines="$lines"'  <br>*(could not fetch both blobs to render a diff — follow the links above)*'$'\n'
              continue
            fi

            body=$(diff -U2 /tmp/pw_old /tmp/pw_new || true)
            # Drop diff's own ---/+++ header: the file is already named above.
            body=$(printf '%s\n' "$body" | tail -n +3)
            total=$(printf '%s\n' "$body" | wc -l)

            if [ "$total" -gt "$DIFF_LINES_PER_FILE" ]; then
              body=$(printf '%s\n' "$body" | head -n "$DIFF_LINES_PER_FILE")
              body="$body"$'\n'"... truncated at $DIFF_LINES_PER_FILE of $total lines — see the links above"
            fi

            lines="$lines"$'\n'"  <details><summary>diff</summary>"$'\n\n'"  \`\`\`diff"$'\n'
            while IFS= read -r dl; do
              lines="$lines  $dl"$'\n'
            done <<< "$body"
            lines="$lines"'  ```'$'\n\n'"  </details>"$'\n\n'
          done
          # Idempotency: if the notification for this head_sha is already posted
          # (a previous run died between comment and baseline update), skip the
          # duplicate comment but still update the baseline below
          marker="<!-- protocol-watch:$head_sha -->"
          # Capture first: an API failure must abort the run (set -e), and a
          # grep -q early-exit must not SIGPIPE the gh call under pipefail
          existing_comments=$(gh api "repos/$REPO/issues/$number/comments" --paginate --jq '.[].body')
          if grep -qF "$marker" <<< "$existing_comments"; then
            echo "Notification for $head_sha already posted; updating the baseline only."
          else
            comment=$(printf '%s\n%s changed on `%s` `%s` (checked at upstream commit %s):\n\n%s\nFollow-ups to consider: %s\n' "$marker" "$WHAT" "$UPSTREAM" "$UPSTREAM_REF" "$head_sha" "$lines" "$FOLLOW_UP")
            if [ "${#comment}" -gt "$MAX_COMMENT_CHARS" ]; then
              links="$links"$'\n'"*The diffs would exceed a comment's size limit, so they are left out: follow the links.*"$'\n'
              comment=$(printf '%s\n%s changed on `%s` `%s` (checked at upstream commit %s):\n\n%s\nFollow-ups to consider: %s\n' "$marker" "$WHAT" "$UPSTREAM" "$UPSTREAM_REF" "$head_sha" "$links" "$FOLLOW_UP")
            fi
            gh issue comment "$number" --repo "$REPO" --body "$comment"
          fi

          # Update the baseline in the issue body
          gh issue edit "$number" --repo "$REPO" --body "$(baseline_body "$head_sha" "$current")"
          echo "Comment posted and baseline updated."
