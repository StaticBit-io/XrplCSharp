name: .NET CI

env:
  DOTNET_VERSION: '10.0.x'

on:
  push:
    branches: [ dev, release ]
  pull_request:
    branches: [ dev, release ]
  merge_group:
  workflow_dispatch:

# New pushes to a PR cancel its in-flight run; push/merge-queue runs are never cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    # A run reads the caches of its own ref and of dev, the default branch. Merge-queue refs
    # are new each time, so the queue restores what the push to dev saved. The key only
    # decides when a fresh copy is saved: restore still resolves every package the projects
    # name, so a stale cache costs a download, never a wrong package.
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-
    - name: Build
      run: dotnet build

  unit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-
    - name: Build
      run: dotnet build
    # --no-build: the step above has built everything. Building again here printed every
    # compiler warning a second time, at normal verbosity, around the test results.
    - name: Test Unit
      run: dotnet test --no-build --verbosity normal --settings test.runsettings --filter "TestU"

  stand-image:
    # Keeps the stand image's layers in the GitHub Actions cache of dev, the one cache the
    # merge queue's integration shards can read. The integration suite skips the push to dev,
    # so without this job nothing would save them there.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build the xrpld stand image
      uses: docker/bake-action@v6
      with:
        source: .
        files: .ci-config/docker-compose.ci.yml
        targets: xrpld
        # Bake resolves the compose build context from the repository root, not from the
        # compose file's directory as docker compose does.
        set: |
          xrpld.context=.ci-config
          xrpld.cache-from=type=gha,scope=xrpld-stand
          xrpld.cache-to=type=gha,scope=xrpld-stand,mode=max
          xrpld.output=type=cacheonly

  integration-shard:
    # Integration runs in the merge queue (merge_group) before a merge into dev lands, on
    # promotion PRs into release, on the push to release that publishes, and on demand.
    # It skips PRs into dev - the queue re-runs it on the merge result - and the push to dev
    # that follows a queued merge, which is the commit the queue has just tested.
    if: >-
      (github.event_name != 'pull_request' || github.base_ref == 'release') &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/dev')
    # Three runners, each with its own stand: MSTest runs one class at a time per core, and
    # one runner took the suite past 25 minutes. .ci-config/integration-shards.txt assigns
    # the classes; the last shard takes every class not listed.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # The image is built from .ci-config/Dockerfile.release on every run, never taken as it
    # is, so a stand cannot silently test an old pin. Its layers come from the GitHub Actions
    # cache, keyed by the Dockerfile's instructions: a new XRPLD_VERSION misses the cache from
    # that line on and installs the new package.
    - name: Build the xrpld stand image
      uses: docker/bake-action@v6
      with:
        source: .
        files: .ci-config/docker-compose.ci.yml
        targets: xrpld
        load: true
        # Bake resolves the compose build context from the repository root, not from the
        # compose file's directory as docker compose does.
        set: |
          xrpld.context=.ci-config
          xrpld.cache-from=type=gha,scope=xrpld-stand
          xrpld.cache-to=type=gha,scope=xrpld-stand,mode=max

    - name: Start xrpld + ledger-acceptor
      # --no-build: the step above has just built the image from the current Dockerfile.
      run: docker compose -f .ci-config/docker-compose.ci.yml up -d --no-build

    - name: Wait for rippled to be ready
      run: |
        # AMM amendment id (sha512half of the name) — sentinel for genesis
        # amendment activation from the [amendments] section in rippled.cfg.
        # Without this check tests start against a node where amendment-gated
        # transactors return temDISABLED and the affected tests silently skip.
        SENTINEL="8CC0774A3BF66D1D22E76BBDA8E8A232E6B6313834301B3B23E8601196AE6455"
        for i in $(seq 1 30); do
          if curl -sf --max-time 5 http://localhost:5005/ -d '{"method":"server_info"}' > /dev/null 2>&1; then
            # `|| true`: this step runs under bash -e; a jq parse failure on a
            # partial/garbage response would otherwise abort the whole step
            # instead of letting the loop retry.
            enabled=$(curl -sf --max-time 5 http://localhost:5005/ \
              -d "{\"method\":\"feature\",\"params\":[{\"feature\":\"$SENTINEL\"}]}" \
              | jq -r ".result.\"$SENTINEL\".enabled" 2>/dev/null || true)
            if [ "$enabled" = "true" ]; then
              echo "rippled is ready, sentinel amendment (AMM) is enabled"
              exit 0
            fi
            echo "rippled is up but sentinel amendment not enabled yet... ($i/30)"
          else
            echo "Waiting for rippled... ($i/30)"
          fi
          sleep 2
        done
        echo "::error::rippled did not become ready (or amendments inactive) after 30 attempts — dumping diagnostics"
        docker compose -f .ci-config/docker-compose.ci.yml ps
        docker compose -f .ci-config/docker-compose.ci.yml logs --no-color xrpld
        exit 1

    - name: Use .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    # The standalone profile is the default (XRPL_TEST_NODE unset -> ws://localhost:6006);
    # a stand on other ports or a public network is selected with XRPL_TEST_NODE_URL /
    # XRPL_TEST_NODE, see Tests/Xrpl.Tests/Integration/README.md and devnet-coverage.yml.
    - name: Test Integration
      run: |
        filter=$(bash .ci-config/integration-shard-filter.sh ${{ matrix.shard }})
        echo "Shard ${{ matrix.shard }}: $filter"
        dotnet test Tests/Xrpl.Tests/Xrpl.Tests.csproj --no-build --verbosity normal --settings test.runsettings --filter "$filter"

    # x402 integration tests: hermetic E2E against the standalone rippled above.
    # The live t54 interop tests (TestCategory=Live) are excluded — they are the only tests
    # in the suite that reach outside, needing the public XRPL testnet faucet and the hosted
    # t54 facilitator, so leaving them in made a green build depend on two third-party
    # services. Run them deliberately:
    #   dotnet test Tests/Xrpl.X402.Tests/Xrpl.X402.Tests.csproj --filter "TestCategory=Live"
    - name: Test Integration (Xrpl.X402)
      if: matrix.shard == 3
      run: dotnet test Tests/Xrpl.X402.Tests/Xrpl.X402.Tests.csproj --no-build --verbosity normal --settings test.runsettings --filter "TestI&TestCategory!=Live"
      env:
        HOST: localhost
        PORT: 6006

    - name: Stop docker containers
      if: always()
      run: docker compose -f .ci-config/docker-compose.ci.yml down

  integration:
    # The required check the branch rules name: green when every shard is. It skips exactly
    # when the shards do, and a skipped required check counts as satisfied.
    needs: integration-shard
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.base_ref == 'release') &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
    - name: All shards passed
      run: |
        echo "integration-shard: ${{ needs.integration-shard.result }}"
        test "${{ needs.integration-shard.result }}" = "success"
