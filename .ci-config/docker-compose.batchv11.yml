services:
  xrpld:
    build:
      context: .
      dockerfile: Dockerfile.nightly
    image: rippled-nightly:local
    container_name: rippled-batchv11
    command: ["-a", "--start"]
    ports:
      # Admin RPC/WS — publish to loopback only; the ledger-acceptor sidecar reaches
      # the node over the compose network, tests connect via localhost
      - "127.0.0.1:5005:5005"
      - "127.0.0.1:5006:5006"
      - "127.0.0.1:6006:6006"
      # credential-protected admin ws port, see [port_ws_admin_auth] in rippled.batchv11.cfg
      - "127.0.0.1:6007:6007"
    volumes:
      - ./rippled.batchv11.cfg:/config/rippled.cfg:ro
      - ./validators.txt:/config/validators.txt:ro

  ledger-acceptor:
    image: curlimages/curl:latest
    container_name: ledger-acceptor-batchv11
    depends_on:
      - xrpld
    entrypoint:
      - sh
      - -c
      - |
        sleep 3
        while true; do
          curl -s -X POST http://xrpld:5006/ \
            -H "Content-Type: application/json" \
            -d '{"method":"ledger_accept"}'
          sleep 4
        done
    restart: unless-stopped
