services:
  xrpld:
    image: xrpllabsofficial/xrpld:3.2.0
    container_name: rippled-service
    command: ["-a", "--start"]
    ports:
      - "5005:5005"
      - "5006:5006"
      - "6006:6006"
      # credential-protected admin ws port, see [port_ws_admin_auth] in rippled.cfg.
      # Loopback-only: rippled.cfg carries these credentials in plain text, so the port
      # must not be reachable from other hosts. Tests connect over localhost.
      - "127.0.0.1:6007:6007"
    volumes:
      - ./rippled.cfg:/config/rippled.cfg:ro
      - ./validators.txt:/config/validators.txt:ro

  ledger-acceptor:
    image: curlimages/curl:latest
    container_name: ledger-acceptor
    depends_on:
      - xrpld
    entrypoint:
      - sh
      - -c
      - |
        sleep 3
        while true; do
          curl -s -X POST http://xrpld:5006/ \
            -H "Content-Type: application/json" \
            -d '{"method":"ledger_accept"}'
          sleep 4
        done
    restart: unless-stopped
