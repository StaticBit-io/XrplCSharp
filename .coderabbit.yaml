language: en-US

reviews:
  profile: chill
  review_status: false
  auto_review:
    # Automatic review is off: reviews are requested on demand with
    # "@coderabbitai review" in a PR comment. The settings below still apply
    # whenever auto_review is switched back on.
    enabled: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    # Review only PRs targeting dev; dev -> main/release promotions re-merge
    # already-reviewed code and produced duplicate findings (see PRs #20/#21)
    base_branches:
      - "dev"